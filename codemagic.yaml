workflows:
  ios-workflow:
    name: Build PIXPAY IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.pixpay.app

    scripts:
      - name: Check project files
        script: |
          ls -la
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "Package.swift" \)

      - name: Build iOS
        script: |
          if [ -d "*.xcodeproj" ]; then
            xcodebuild -project *.xcodeproj \
              -scheme PIXPAY \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "Project Xcode belum tersedia."
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
